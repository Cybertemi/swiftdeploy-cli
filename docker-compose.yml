# Generated by swiftdeploy — do not edit manually
# Edit manifest.yaml and run: swiftdeploy init

services:

  # ── API Service ──────────────────────────────────────────
  api:
    image: swift-deploy-1-node:latest
    container_name: swiftdeploy-api
    restart: unless-stopped
    networks:
      - swiftdeploy-net
    environment:
      MODE: "canary"
      APP_VERSION: "1.0.0"
      APP_PORT: "3000"
    volumes:
      - app-logs:/var/log/app
    # Health check on /healthz
    healthcheck:
      test: ["CMD", "wget", "-qO-",
             "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # Security — non-root, dropped capabilities
    user: "1000:1000"
    cap_drop:
      - ALL
    # Never expose service port directly
    # All traffic routes through Nginx
    expose:
      - "3000"

  # ── Nginx ────────────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: swiftdeploy-nginx
    restart: unless-stopped
    networks:
      - swiftdeploy-net
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy

networks:
  swiftdeploy-net:
    name: swiftdeploy-net
    driver: bridge

volumes:
  app-logs:
  nginx-logs:
