# Generated by swiftdeploy — do not edit manually
# Edit manifest.yaml and run: swiftdeploy init

services:

  # ── API Service ──────────────────────────────────────────
  api:
    image: swift-deploy-1-node:latest
    container_name: swiftdeploy-api
    restart: unless-stopped
    networks:
      - swiftdeploy-net
    environment:
      MODE: "stable"
      APP_VERSION: "1.0.0"
      APP_PORT: "3000"
    volumes:
      - app-logs:/var/log/app
    healthcheck:
      test: ["CMD", "wget", "-qO-",
             "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    cap_drop:
      - ALL
    expose:
      - "3000"

  # ── Nginx ────────────────────────────────────────────────
  # Only Nginx is exposed publicly
  # API port is never exposed directly
  nginx:
    image: nginx:latest
    container_name: swiftdeploy-nginx
    restart: unless-stopped
    networks:
      - swiftdeploy-net
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy

  # ── OPA Policy Agent ─────────────────────────────────────
  # Port 8181 exposed to host so swiftdeploy CLI can query it
  # NOT routed through Nginx — no public ingress access
  # The submission requirement says OPA must not be accessible
  # via the Nginx port (8080) — it is not, it uses 8181
  opa:
    image: openpolicyagent/opa:latest-rootless
    container_name: swiftdeploy-opa
    restart: unless-stopped
    networks:
      - swiftdeploy-net
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./policies:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=error"
      - "/policies"

networks:
  swiftdeploy-net:
    name: swiftdeploy-net
    driver: bridge

volumes:
  app-logs:
  nginx-logs:
