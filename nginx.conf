# Generated by swiftdeploy — do not edit manually
# Edit manifest.yaml and run: swiftdeploy init

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    # ── Access log format ─────────────────────────────────
    log_format swiftdeploy
        '$time_iso8601 | $status | ${request_time}s | '
        '$upstream_addr | $request';

    access_log /var/log/nginx/access.log swiftdeploy;

    # ── Timeouts from manifest ────────────────────────────
    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    proxy_intercept_errors on;

    error_page 502 = @error502;
    error_page 503 = @error503;
    error_page 504 = @error504;

    server {
        listen 8080;
        server_name _;

        # ── resolver allows runtime hostname lookup ────────
        # This prevents nginx from failing syntax check when
        # the upstream "api" container is not yet running
        resolver 127.0.0.11 valid=10s;
        set $upstream_api http://api:3000;

        # ── Add swiftdeploy header to all responses ───────
        add_header X-Deployed-By swiftdeploy always;

        # ── Forward X-Mode header from upstream ──────────
        proxy_pass_header X-Mode;

        # ── Proxy to the API service ──────────────────────
        location / {
            proxy_pass         $upstream_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── JSON error handlers ───────────────────────────
        location @error502 {
            default_type application/json;
            add_header X-Deployed-By swiftdeploy always;
            return 502 '{"error":"bad gateway","code":"502","service":"swift-deploy-1-node:latest","contact":"ops@swiftdeploy.io"}';
        }

        location @error503 {
            default_type application/json;
            add_header X-Deployed-By swiftdeploy always;
            return 503 '{"error":"service unavailable","code":"503","service":"swift-deploy-1-node:latest","contact":"ops@swiftdeploy.io"}';
        }

        location @error504 {
            default_type application/json;
            add_header X-Deployed-By swiftdeploy always;
            return 504 '{"error":"gateway timeout","code":"504","service":"swift-deploy-1-node:latest","contact":"ops@swiftdeploy.io"}';
        }
    }
}
